name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform to build
        required: true
        default: windows
        type: choice
        options:
          - windows
          - macos
          - all
      publish_release:
        description: Publish a GitHub Release after building
        required: true
        default: true
        type: boolean
      release_tag:
        description: Release tag to create when publishing manually, for example v1.0.0
        required: false
        type: string
      release_name:
        description: Release title override for manual publishing
        required: false
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    if: github.event_name == 'push' || github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS artifacts
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ secrets.CSC_LINK }}" ]]; then
            export CSC_LINK='${{ secrets.CSC_LINK }}'
            export CSC_KEY_PASSWORD='${{ secrets.CSC_KEY_PASSWORD }}'
            export APPLE_ID='${{ secrets.APPLE_ID }}'
            export APPLE_APP_SPECIFIC_PASSWORD='${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}'
            export APPLE_TEAM_ID='${{ secrets.APPLE_TEAM_ID }}'
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi

          npm run package:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cuecast-macos
          path: release/*
          if-no-files-found: error

  build-windows:
    if: github.event_name == 'push' || github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows artifacts
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ secrets.CSC_LINK }}" ]]; then
            export CSC_LINK='${{ secrets.CSC_LINK }}'
            export CSC_KEY_PASSWORD='${{ secrets.CSC_KEY_PASSWORD }}'
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi

          npm run package:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cuecast-windows
          path: release/*
          if-no-files-found: error

  publish-release:
    if: |
      always() &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
      ) &&
      (
        needs.build-windows.result == 'success' ||
        needs.build-macos.result == 'success'
      ) &&
      needs.build-windows.result != 'failure' &&
      needs.build-macos.result != 'failure'
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cuecast-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.release_tag }}
          RELEASE_NAME: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.release_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          if [[ -z "$tag" ]]; then
            echo "release_tag is required when publish_release is true for workflow_dispatch"
            exit 1
          fi

          name="${RELEASE_NAME}"
          if [[ -z "$name" ]]; then
            name="$tag"
          fi

          mapfile -d '' files < <(find release-artifacts -maxdepth 1 -type f -print0)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release files found in release-artifacts"
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "$name" --notes "Automated release for $tag" --target "$TARGET_SHA"
          fi